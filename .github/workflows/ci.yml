name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Tests
        run: npm run test

      # Deliberately last, and a ratchet rather than a clean-slate check. This step
      # used to sit above Build as a bare `npx astro check`, which exits 1 on the
      # ~617 pre-existing errors — so Build and Run Tests above had never once
      # executed. Gating on "no worse than type-errors.json" keeps new errors out
      # while letting the steps that catch real regressions actually run.
      - name: Type Check (ratchet)
        run: node scripts/check-ratchet.mjs
