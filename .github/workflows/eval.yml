name: AI drift check

# Catches the two ways the assistant rots without anyone touching it:
#
#  1. The configured model is retired. This already happened once — the site served
#     errors from a dead `gemini-2.0-flash` for weeks, because a 404 from the provider
#     was swallowed into a generic 500 and nobody was looking.
#  2. The model still answers, but stops answering *correctly* — a prompt edit, a
#     corpus change, or the provider re-tuning the model underneath.
#
# Requires the `ANTHROPIC_API_KEY` repository secret
# (Settings → Secrets and variables → Actions).

on:
  schedule:
    # Nightly Mon–Sat: the free model check plus a three-case smoke set.
    - cron: '0 6 * * 1-6'
    # Sunday: the full golden set.
    #
    # Split by cost. A full 16-case run is ~$0.18, so running it nightly would come to
    # ~$5.30/month — as much as the site's entire spend ceiling, to test a site with
    # very little traffic. This shape costs ~$1.60/month and still catches a retired
    # model within 24 hours, which is the failure that actually occurred.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which eval set to run'
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  drift:
    name: Model availability and golden set
    runs-on: ubuntu-latest
    # To commit the result back to src/data/ai-eval-status.json, which /ai-project
    # renders. Nothing else in this job writes to the repo.
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Free — a Models API GET, not inference. This alone is worth the workflow.
      - name: Verify the configured model is still served
        run: npm run verify:model

      - name: Start the site
        run: |
          nohup npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4321/ > /dev/null; then
              echo "dev server up after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "::error::dev server did not come up within 120s"
          tail -50 dev.log
          exit 1

      # No Upstash credentials in CI, so src/lib/ai/budget.ts stands aside and the
      # eval does not consume the production spend ceiling. Deliberately not pointed
      # at the deployed site via CHAT_BASE_URL for the same reason.
      - name: Run the eval
        env:
          EVAL_ONLY: >-
            ${{ (github.event.schedule == '0 6 * * 0' || github.event.inputs.scope == 'full')
                && ''
                || 'names the university|German in, German out|declines instead of inventing' }}
          EVAL_STATUS_OUT: src/data/ai-eval-status.json
        run: npm run eval

      # `always()` so a *failing* eval is published too. A status file that can only
      # ever say "passing" is decoration — the reason to put it on the page is that it
      # is able to say something Anton would rather it did not. The step above has
      # already set the job to failed, and this does not undo that.
      - name: Publish the result
        if: always()
        run: |
          if [ ! -f src/data/ai-eval-status.json ]; then
            echo "no status file — the eval did not get far enough to write one"
            exit 0
          fi
          if git diff --quiet -- src/data/ai-eval-status.json; then
            echo "result unchanged since the last run; nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/ai-eval-status.json
          # [skip ci] so committing the result does not trigger other workflows.
          git commit -m "chore(eval): publish golden-set result [skip ci]"
          git push

      - name: Server log on failure
        if: failure()
        run: tail -100 dev.log
